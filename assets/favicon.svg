<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172b52"/><stop offset=".5" stop-color="#0a0e26"/><stop offset="1" stop-color="#350d2a"/></linearGradient>
<linearGradient id="ice" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#9aefff"/><stop offset=".55" stop-color="#30b8fc"/><stop offset="1" stop-color="#2151a8"/></linearGradient>
<linearGradient id="fire" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff99a8"/><stop offset=".55" stop-color="#ff3f66"/><stop offset="1" stop-color="#a9164b"/></linearGradient>
<linearGradient id="border" x1="0" x2="1"><stop stop-color="#53dcff"/><stop offset=".5" stop-color="#d9f4ff"/><stop offset="1" stop-color="#ff5479"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>
<rect x="1" y="1" width="62" height="62" rx="13" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
